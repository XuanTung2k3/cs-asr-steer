[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csasr-steering"
version = "0.1.0"
description = "Local language activation steering for code-switched ASR (E1-E5 feasibility)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "soundfile>=0.12",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
    "tqdm>=4.65",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
