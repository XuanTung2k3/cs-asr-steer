# Gate-A evidence: typed synthetic/reference data, optional human audit, jitter.
# Thresholds live here rather than in code so the gate is data, and so the
# pre-decided failure responses are written down before any number is seen.

synthetic:
  # Candidate pools exceed the 100-boundary usable requirement.  Exactly 100
  # generated items would silently turn that requirement into 100% scorability.
  num_pairs_dev: 150
  num_pairs_gate: 150
  gap_ms: 0.0
  trim_silence: true
  trim_pad_ms: 20.0
  max_duration_sec: 28.0
  source_role: D-construct
  reference_kind: audio_splice
  conventions: [unit_edge_canonical, midpoint_legacy]

audit:
  n_en: 100
  n_zh: 100
  context_sec: 1.5
  duplicate_fraction: 0.10
  perturbed_fraction: 0.10
  perturb_ms: 250.0
  strata: [language, confidence_bin, duration_tercile]
  min_annotators: 2
  overlap_items: 60
  require_corrected_times: 120
  pool_roles: [D-construct]
  clip_format: wav
  render_figures: true

jitter:
  offsets_ms: [50, 100]
  independent_edges: true

gate_a:
  # M - mechanical: is there a well-formed second opinion at all
  min_valid_families: 2            # counted by independence class, so two
                                   # variants of one estimator are still one
  min_family_valid_unit_coverage: 0.95
  min_unit_coverage: 0.95          # proposal 4.1: coverage >= 0.95
  min_paired_units: 100
  min_paired_target_rate: 0.90
  max_nonmonotonic_rate: 0.01      # proposal 4.1: invalid/nonmonotonic <= 0.01
  # X - external accuracy; these are the ones that are never weakened.
  #
  # Two kinds of evidence live here and they are NOT interchangeable.
  # `cross_aligner_*` is measured between two independent aligners on natural
  # speech: it is estimator disagreement, and a shared bias makes both aligners
  # agree while both are wrong. Absolute error is permitted only for explicit
  # lexical reference kinds (manual, existing gold, or genuinely exact lexical
  # construction). The configured RMS/VAD splice is only an audio seam and
  # cannot satisfy those criteria. The disagreement quantities carry their own
  # limits at the same numbers because disagreement larger than the tolerated
  # error cannot be consistent with both aligners being accurate.
  max_cross_aligner_boundary_disagreement_ms: 100.0
  max_cross_aligner_boundary_disagreement_p90_ms: 200.0
  max_cross_aligner_en_zh_diff_ms: 30.0
  min_synthetic_boundaries: 100
  min_synthetic_within_100ms: 0.90
  max_synthetic_abs_bias_ms: 50.0
  # A - automatic configuration selection, on DEVELOPMENT items only.
  #
  # Deliberately the same numbers as max_human_*_abs_error_ms below. They may be
  # applied only to genuine lexical reference kinds. The present RMS/VAD splice
  # is an audio seam and therefore leaves automatic tolerance selection blocked.
  max_selection_median_abs_error_ms: 100.0
  max_selection_p90_abs_error_ms: 200.0
  # A median over a handful of items that happened to agree is not a selection.
  min_selection_boundaries: 50
  min_pred_start_boundaries: 50
  # Prospective amendment, disclosed after job 38573 and before the next fresh
  # confirmatory gate generation. The sealed v1 spec literally names the human
  # audit as the tolerance-selection instrument; automatic mode instead uses
  # genuine exact lexical development boundaries. This is an amendment, not an
  # interpretation silently attributed to the original freeze. The present
  # audio-splice instrument does not qualify, so the amendment is superseded and
  # Gate A remains blocked until compatible evidence exists.
  automatic_instrument_amendment:
    id: gate-a-automatic-instrument-amendment-2026-08-11
    document: docs/proposal_arr/GATE_A_AUTOMATIC_INSTRUMENT_AMENDMENT_2026-08-11.md
    status: superseded_pending_genuine_lexical_reference
    effective_from_gate_generation: 1
  min_human_units: 200
  min_human_units_per_language: 100
  min_human_units_with_times: 120
  min_human_usable_fraction: 0.90
  max_human_median_abs_error_ms: 100.0
  max_human_p90_abs_error_ms: 200.0
  max_human_en_zh_median_diff_ms: 30.0
  min_inter_annotator_alpha: 0.67
  min_decoy_detection_rate: 0.80
  max_calibration_offset_inconsistency_ms: 50.0
  # J - jitter stability (proposal 4.1 requires BOTH +/-50 and +/-100 ms).
  # The 100 ms limits are unchanged; the 50 ms ones are new and are set to the
  # same numbers, which is the weaker requirement at the smaller perturbation.
  min_jitter_mask_iou_50ms: 0.60
  max_jitter_cross_language_contamination_50ms: 0.05
  min_jitter_safe_interior_survival_50ms: 0.90
  min_jitter_mask_iou_100ms: 0.60
  max_jitter_cross_language_contamination_100ms: 0.05
  min_jitter_safe_interior_survival_100ms: 0.90
  # C - coverage, as absolute counts: a rate threshold above what the data can
  # deliver turns a gate into a schedule bomb, and weakening it is forbidden
  min_construct_bilingual_utterances: 500
  min_loc_train_en_spans: 1000
  min_dev_select_targets: 300
  min_dev_confirm_targets: 150
  # Role sufficiency is a property of the complete L0-frozen role manifests,
  # not of alignment.diagnostics.sample_utterances.
  data_sufficiency_universe: full_l0_role_manifest

failure_response:
  external_fails_on_high_bin: stop_and_repair
  external_fails_on_medium_bin: restrict_to_high_bin
  coverage_fails:
    - long_span_subset
    - calibrated_arm
    - alternate_estimator
    - fallback_manuscript
  qwen_blocked: proceed_with_two_families
  # Blocked reasons are not failures: they name evidence that does not exist
  # yet. Each has one response and none of them is "use a different metric".
  blocked_missing_synthetic_calibration: implement_synthetic_scoring_or_manual_mode
  blocked_missing_genuine_lexical_calibration: provide_manual_gold_or_constructed_exact_lexical_boundaries
  blocked_insufficient_independent_aligners: repair_whisper_dtw_or_enable_qwen
  blocked_no_candidate_alignments: run_the_aligner_sweep
  blocked_tainted_inputs: rerun_prerequisites_without_force_prereq
  blocked_missing_manual_verdicts: annotate_the_audit_pack
  blocked_unselected_operating_tolerance: run_the_synthetic_part_so_the_development_selection_exists
  blocked_no_qualifying_operating_tolerance: repair_alignment_accuracy_no_tolerance_meets_the_rule
  blocked_uncalibrated_natural_families: score_the_qualifying_families_on_the_synthetic_gate_set
  blocked_missing_development_set: run_l1a_so_the_synthetic_development_set_exists
  blocked_exposed_gate_set: render_a_fresh_gate_generation_from_unexposed_sources
